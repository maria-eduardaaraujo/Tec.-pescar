<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turma T.I</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background-image: linear-gradient(to bottom, rgb(248, 110, 110), rgb(225, 129, 252), rgb(106, 106, 255));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    header h1 {
      color: white;
      text-shadow: 2px 2px 4px black;
      text-align: center;
      margin-bottom: 1.5rem;
      font-size: 5rem;
    }

    .img img {
      width: 90%;
      max-width: 400px;
      height: auto;
      border-radius: 20px;
      display: block;
      margin: 0 auto 2rem auto;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    button {
      background-color: #0077ff;
      color: white;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      border: none;
      padding: 0.8rem 1.5rem;
      font-size: 1rem;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #005fd1;
    }
    @media (max-width: 600px) {
      header h1 {
        font-size: 1.5rem;
      }

      button {
        width: 80%;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Turma T.I</h1>
  </header>

  <div class="img">
    <img src="Foto_turma.jpeg" alt="Foto da Turma T.I">
  </div>

  <button id="botao">Venha conhecer a nossa turma</button>
  <script>
    const botao = document.getElementById("botao");

    botao.addEventListener("click", function() {
     window.location.href = "https://www.google.com/";
    });
  </script>
</body>
</html>
